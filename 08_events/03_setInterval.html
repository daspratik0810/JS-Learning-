<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #show {
        padding: 10px;
        border: 1px solid black;
        margin: 10px;
        border-radius: 5px;
        background-color: aqua;
      }
      .messageBox {
        backdrop-filter: blur(5px);
        position: fixed;
        bottom: 0;
        left: 0;
        padding: 10px;
        width: 100%;
        margin: auto;
        text-align: center;
        border-top: 1px solid #dadada;
        box-shadow: -5px 0 10px #0000ff50;
        background-color: #0000ff10;
      }
      input,
      button {
        padding: 5px 10px;
        border-radius: 5px;
        outline: none;
        border: 1px solid #0000ff90;
      }
    </style>
  </head>
  <body>
    <h1>Chai aur Javascript</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <div id="show"></div>
    <div class="messageBox">
      <input placeholder="WRITE YOUR MESSAGE" />
      <button>SEND</button>
    </div>
  </body>

  <script>
    const box = document.getElementById("show");

    let prevMess = "No Prev Message";

    const funct = function (mess) {
      const dt = new Date();

      box.innerHTML +=
        "New Message:" +
        mess +
        dt.toLocaleString() +
        "<br> Prev Message:" +
        prevMess +
        "<br>";
      prevMess = mess + dt.toLocaleString();
    };
 
    setInterval(funct, 5000, " ");
  </script>
</html>
